name: Build Monopoly World AAB

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - ".github/workflows/build-aab.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Prepare Capacitor Android project
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat > package.json <<'EOF'
          {
            "name": "monopoly-world",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "6.2.1",
              "@capacitor/android": "6.2.1"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.1"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.monopolyworld.game",
            "appName": "Monopoly World",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF
          npm install
          npx cap add android
          npx cap sync android

      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s = s.replace(
              "    buildTypes {\\n        release {",
              "    buildTypes {\\n        release {\\n            signingConfig signingConfigs.debug",
              1
          )
          p.write_text(s)
          PY

      - name: Build debug-signed AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: MonopolyWorld-AAB
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
